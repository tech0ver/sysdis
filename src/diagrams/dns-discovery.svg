<svg class="diagram-svg" viewBox="0 0 720 288" role="img" aria-labelledby="dns-discovery-title dns-discovery-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="dns-discovery-title">DNS and service discovery</title>
  <desc id="dns-discovery-desc">The app asks DNS for the address of api.example.com and connects to the server at that address and port. Inside the system, the server asks a service registry which media service instances are alive and calls one of them.</desc>
  <defs>
    <marker id="dns-discovery-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <!-- The app asks DNS -->
  <path class="dg-arrow" d="M40 152 V56 Q40 48 48 48 H168" marker-end="url(#dns-discovery-head)"/>
  <text class="dg-mono dg-muted-text" x="104" y="40" text-anchor="middle">api.example.com</text>
  <path class="dg-arrow dg-empty" d="M168 64 H80 Q72 64 72 72 V152" marker-end="url(#dns-discovery-head)"/>
  <text class="dg-mono dg-muted-text" x="124" y="84" text-anchor="middle">203.0.113.10</text>
  <!-- The app connects -->
  <line class="dg-arrow" x1="112" y1="176" x2="336" y2="176" marker-end="url(#dns-discovery-head)"/>
  <text class="dg-mono dg-muted-text" x="224" y="168" text-anchor="middle">203.0.113.10:8080</text>
  <!-- The server asks the registry -->
  <path class="dg-arrow" d="M400 152 V56 Q400 48 408 48 H528" marker-end="url(#dns-discovery-head)"/>
  <text class="dg-mono dg-muted-text" x="464" y="40" text-anchor="middle">MEDIA SERVICE?</text>
  <path class="dg-arrow dg-empty" d="M528 64 H440 Q432 64 432 72 V152" marker-end="url(#dns-discovery-head)"/>
  <text class="dg-mono dg-muted-text" x="484" y="84" text-anchor="middle">INSTANCE 1</text>
  <line class="dg-arrow" x1="480" y1="176" x2="568" y2="176" marker-end="url(#dns-discovery-head)"/>
  <!-- Components -->
  <rect class="dg-box" x="0" y="152" width="112" height="48" rx="6"/>
  <text class="dg-name" x="56" y="181" text-anchor="middle">App</text>
  <rect class="dg-box-accent" x="168" y="24" width="144" height="48" rx="6"/>
  <text class="dg-name" x="240" y="45" text-anchor="middle">DNS</text>
  <text class="dg-sub" x="240" y="62" text-anchor="middle">name → address</text>
  <rect class="dg-box" x="336" y="152" width="144" height="48" rx="6"/>
  <text class="dg-name" x="408" y="181" text-anchor="middle">Server</text>
  <rect class="dg-box-accent" x="528" y="24" width="176" height="48" rx="6"/>
  <text class="dg-name" x="616" y="45" text-anchor="middle">Service registry</text>
  <text class="dg-sub" x="616" y="62" text-anchor="middle">alive instances</text>
  <rect class="dg-box" x="568" y="152" width="144" height="48" rx="6"/>
  <text class="dg-name" x="640" y="181" text-anchor="middle">Media service 1</text>
  <rect class="dg-box-failed" x="568" y="224" width="144" height="48" rx="6"/>
  <text class="dg-name-muted" x="640" y="245" text-anchor="middle">Media service 2</text>
  <text class="dg-sub" x="640" y="262" text-anchor="middle">stopped</text>
</svg>
