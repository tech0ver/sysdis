<svg class="diagram-svg" viewBox="0 0 720 228" role="img" aria-labelledby="balancing-title balancing-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="balancing-title">Round robin, weighted round robin, least connections</title>
  <desc id="balancing-desc">Round robin sends requests 1 to 6 to servers A, B and C in turn. Weighted round robin sends requests 1 to 8 so that server A, which is twice as big, gets four and servers B and C get two each. Least connections sends a new connection to server B, which has the fewest open connections.</desc>
  <!-- Round robin -->
  <text class="dg-name" x="0" y="16">Round robin</text>
  <text class="dg-sub" x="0" y="34">in turn</text>
  <rect class="dg-box" x="0" y="52" width="88" height="32" rx="6"/>
  <text class="dg-name" x="44" y="73" text-anchor="middle">Server A</text>
  <rect class="dg-chip" x="100" y="58" width="20" height="20" rx="3"/>
  <text class="dg-mono dg-ink-text" x="110" y="72" text-anchor="middle">1</text>
  <rect class="dg-chip" x="126" y="58" width="20" height="20" rx="3"/>
  <text class="dg-mono dg-ink-text" x="136" y="72" text-anchor="middle">4</text>
  <rect class="dg-box" x="0" y="96" width="88" height="32" rx="6"/>
  <text class="dg-name" x="44" y="117" text-anchor="middle">Server B</text>
  <rect class="dg-chip" x="100" y="102" width="20" height="20" rx="3"/>
  <text class="dg-mono dg-ink-text" x="110" y="116" text-anchor="middle">2</text>
  <rect class="dg-chip" x="126" y="102" width="20" height="20" rx="3"/>
  <text class="dg-mono dg-ink-text" x="136" y="116" text-anchor="middle">5</text>
  <rect class="dg-box" x="0" y="140" width="88" height="32" rx="6"/>
  <text class="dg-name" x="44" y="161" text-anchor="middle">Server C</text>
  <rect class="dg-chip" x="100" y="146" width="20" height="20" rx="3"/>
  <text class="dg-mono dg-ink-text" x="110" y="160" text-anchor="middle">3</text>
  <rect class="dg-chip" x="126" y="146" width="20" height="20" rx="3"/>
  <text class="dg-mono dg-ink-text" x="136" y="160" text-anchor="middle">6</text>
  <!-- Weighted round robin -->
  <text class="dg-name" x="248" y="16">Weighted round robin</text>
  <text class="dg-sub" x="248" y="34">A is twice as big</text>
  <rect class="dg-box" x="248" y="52" width="88" height="32" rx="6"/>
  <text class="dg-name" x="292" y="73" text-anchor="middle">Server A</text>
  <rect class="dg-chip" x="348" y="58" width="20" height="20" rx="3"/>
  <text class="dg-mono dg-ink-text" x="358" y="72" text-anchor="middle">1</text>
  <rect class="dg-chip" x="374" y="58" width="20" height="20" rx="3"/>
  <text class="dg-mono dg-ink-text" x="384" y="72" text-anchor="middle">2</text>
  <rect class="dg-chip" x="400" y="58" width="20" height="20" rx="3"/>
  <text class="dg-mono dg-ink-text" x="410" y="72" text-anchor="middle">5</text>
  <rect class="dg-chip" x="426" y="58" width="20" height="20" rx="3"/>
  <text class="dg-mono dg-ink-text" x="436" y="72" text-anchor="middle">6</text>
  <rect class="dg-box" x="248" y="96" width="88" height="32" rx="6"/>
  <text class="dg-name" x="292" y="117" text-anchor="middle">Server B</text>
  <rect class="dg-chip" x="348" y="102" width="20" height="20" rx="3"/>
  <text class="dg-mono dg-ink-text" x="358" y="116" text-anchor="middle">3</text>
  <rect class="dg-chip" x="374" y="102" width="20" height="20" rx="3"/>
  <text class="dg-mono dg-ink-text" x="384" y="116" text-anchor="middle">7</text>
  <rect class="dg-box" x="248" y="140" width="88" height="32" rx="6"/>
  <text class="dg-name" x="292" y="161" text-anchor="middle">Server C</text>
  <rect class="dg-chip" x="348" y="146" width="20" height="20" rx="3"/>
  <text class="dg-mono dg-ink-text" x="358" y="160" text-anchor="middle">4</text>
  <rect class="dg-chip" x="374" y="146" width="20" height="20" rx="3"/>
  <text class="dg-mono dg-ink-text" x="384" y="160" text-anchor="middle">8</text>
  <!-- Least connections -->
  <text class="dg-name" x="496" y="16">Least connections</text>
  <text class="dg-sub" x="496" y="34">new goes to the fewest</text>
  <rect class="dg-box" x="496" y="52" width="88" height="32" rx="6"/>
  <text class="dg-name" x="540" y="73" text-anchor="middle">Server A</text>
  <rect class="dg-bar" x="596" y="58" width="6" height="20" rx="1"/>
  <rect class="dg-bar" x="605" y="58" width="6" height="20" rx="1"/>
  <rect class="dg-bar" x="614" y="58" width="6" height="20" rx="1"/>
  <rect class="dg-bar" x="623" y="58" width="6" height="20" rx="1"/>
  <rect class="dg-bar" x="632" y="58" width="6" height="20" rx="1"/>
  <rect class="dg-box" x="496" y="96" width="88" height="32" rx="6"/>
  <text class="dg-name" x="540" y="117" text-anchor="middle">Server B</text>
  <rect class="dg-bar" x="596" y="102" width="6" height="20" rx="1"/>
  <rect class="dg-bar" x="605" y="102" width="6" height="20" rx="1"/>
  <rect class="dg-box-accent" x="622" y="102" width="36" height="20" rx="3"/>
  <text class="dg-mono dg-ink-text" x="640" y="116" text-anchor="middle">new</text>
  <rect class="dg-box" x="496" y="140" width="88" height="32" rx="6"/>
  <text class="dg-name" x="540" y="161" text-anchor="middle">Server C</text>
  <rect class="dg-bar" x="596" y="146" width="6" height="20" rx="1"/>
  <rect class="dg-bar" x="605" y="146" width="6" height="20" rx="1"/>
  <rect class="dg-bar" x="614" y="146" width="6" height="20" rx="1"/>
  <rect class="dg-bar" x="623" y="146" width="6" height="20" rx="1"/>
  <!-- Legend -->
  <line class="dg-rule" x1="0" y1="192" x2="720" y2="192"/>
  <rect class="dg-chip" x="200" y="206" width="12" height="12" rx="2"/>
  <text class="dg-legend" x="220" y="216">request</text>
  <rect class="dg-bar" x="306" y="206" width="6" height="12" rx="1"/>
  <text class="dg-legend" x="320" y="216">open connection</text>
</svg>
