<svg class="diagram-svg" viewBox="0 0 720 296" role="img" aria-labelledby="open-connection-title open-connection-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="open-connection-title">A message for a user on another server</title>
  <desc id="open-connection-desc">User A's app keeps a long-lived connection to server 2. User B's message goes through the load balancer to server 1, which has to find the server that holds user A's connection.</desc>
  <defs>
    <marker id="open-connection-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="open-connection-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <!-- User A's long-lived connection -->
  <rect class="dg-open" x="144" y="200" width="80" height="16"/>
  <rect class="dg-open" x="336" y="200" width="96" height="16"/>
  <line class="dg-open-line" x1="144" y1="208" x2="224" y2="208"/>
  <line class="dg-open-line" x1="336" y1="208" x2="432" y2="208"/>
  <!-- User B's message -->
  <line class="dg-arrow" x1="144" y1="48" x2="224" y2="48" marker-end="url(#open-connection-head)"/>
  <line class="dg-arrow" x1="336" y1="48" x2="432" y2="48" marker-end="url(#open-connection-head)"/>
  <!-- Server 1 has to find server 2 -->
  <line class="dg-arrow dg-message dg-empty" x1="508" y1="72" x2="508" y2="184" marker-end="url(#open-connection-head-accent)"/>
  <text class="dg-mono dg-accent-text" x="520" y="132">WHERE IS USER A?</text>
  <!-- Components -->
  <rect class="dg-box" x="0" y="24" width="144" height="48" rx="6"/>
  <text class="dg-name" x="72" y="45" text-anchor="middle">User B's app</text>
  <text class="dg-sub" x="72" y="62" text-anchor="middle">sends to user A</text>
  <rect class="dg-box" x="0" y="184" width="144" height="48" rx="6"/>
  <text class="dg-name" x="72" y="205" text-anchor="middle">User A's app</text>
  <text class="dg-sub" x="72" y="222" text-anchor="middle">waits for messages</text>
  <rect class="dg-box" x="224" y="24" width="112" height="208" rx="6"/>
  <text class="dg-name" x="280" y="124" text-anchor="middle">Load</text>
  <text class="dg-name" x="280" y="142" text-anchor="middle">balancer</text>
  <rect class="dg-box" x="432" y="24" width="152" height="48" rx="6"/>
  <text class="dg-name" x="508" y="53" text-anchor="middle">Server 1</text>
  <rect class="dg-box" x="432" y="184" width="152" height="48" rx="6"/>
  <text class="dg-name" x="508" y="205" text-anchor="middle">Server 2</text>
  <text class="dg-sub" x="508" y="222" text-anchor="middle">holds A's connection</text>
  <!-- Legend -->
  <line class="dg-rule" x1="0" y1="256" x2="720" y2="256"/>
  <rect class="dg-open" x="184" y="270" width="28" height="12"/>
  <line class="dg-open-line" x1="184" y1="276" x2="212" y2="276"/>
  <text class="dg-legend" x="220" y="280">long-lived connection</text>
</svg>
