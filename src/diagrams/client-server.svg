<svg class="diagram-svg" viewBox="0 0 720 120" role="img" aria-labelledby="client-server-title client-server-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="client-server-title">Client and server are roles</title>
  <desc id="client-server-desc">The app sends a request to the server and gets a response; the server does the same with the database, so the server is a server to the app and a client to the database.</desc>
  <defs>
    <marker id="client-server-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <!-- Requests and responses -->
  <line class="dg-arrow" x1="160" y1="44" x2="280" y2="44" marker-end="url(#client-server-head)"/>
  <line class="dg-arrow dg-empty" x1="280" y1="60" x2="160" y2="60" marker-end="url(#client-server-head)"/>
  <text class="dg-mono dg-muted-text" x="220" y="36" text-anchor="middle">REQUEST</text>
  <text class="dg-mono dg-muted-text" x="220" y="76" text-anchor="middle">RESPONSE</text>
  <line class="dg-arrow" x1="440" y1="44" x2="560" y2="44" marker-end="url(#client-server-head)"/>
  <line class="dg-arrow dg-empty" x1="560" y1="60" x2="440" y2="60" marker-end="url(#client-server-head)"/>
  <text class="dg-mono dg-muted-text" x="500" y="36" text-anchor="middle">REQUEST</text>
  <text class="dg-mono dg-muted-text" x="500" y="76" text-anchor="middle">RESPONSE</text>
  <!-- Components -->
  <rect class="dg-box" x="0" y="24" width="160" height="56" rx="6"/>
  <text class="dg-name" x="80" y="57" text-anchor="middle">App</text>
  <rect class="dg-box" x="280" y="24" width="160" height="56" rx="6"/>
  <text class="dg-name" x="360" y="57" text-anchor="middle">Server</text>
  <rect class="dg-box" x="560" y="24" width="160" height="56" rx="6"/>
  <text class="dg-name" x="640" y="57" text-anchor="middle">Database</text>
  <!-- Roles -->
  <rect class="dg-box" x="52" y="96" width="56" height="16" rx="2"/>
  <text class="dg-mono dg-muted-text" x="80" y="107" text-anchor="middle">CLIENT</text>
  <rect class="dg-box-accent" x="288" y="96" width="56" height="16" rx="2"/>
  <text class="dg-mono dg-ink-text" x="316" y="107" text-anchor="middle">SERVER</text>
  <rect class="dg-box-accent" x="376" y="96" width="56" height="16" rx="2"/>
  <text class="dg-mono dg-ink-text" x="404" y="107" text-anchor="middle">CLIENT</text>
  <rect class="dg-box" x="612" y="96" width="56" height="16" rx="2"/>
  <text class="dg-mono dg-muted-text" x="640" y="107" text-anchor="middle">SERVER</text>
</svg>
