<svg class="diagram-svg" viewBox="0 0 448 316" role="img" aria-labelledby="retries-title retries-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="retries-title">Retries with backoff and jitter</title>
  <desc id="retries-desc">One client retries after a timeout and after a 503 error, and each wait is twice as long as the one before. When three clients fail at the same moment, without jitter they retry together; with jitter their retries spread out.</desc>
  <!-- Backoff: one client waits longer before each attempt -->
  <line class="dg-line" x1="168" y1="64" x2="440" y2="64"/>
  <rect class="dg-chip" x="168" y="56" width="64" height="16" rx="3"/>
  <text class="dg-mono dg-muted-text" x="200" y="48" text-anchor="middle">TIMEOUT</text>
  <rect class="dg-chip" x="272" y="56" width="32" height="16" rx="3"/>
  <text class="dg-mono dg-muted-text" x="288" y="48" text-anchor="middle">503</text>
  <rect class="dg-chip" x="384" y="56" width="32" height="16" rx="3"/>
  <text class="dg-mono dg-muted-text" x="400" y="48" text-anchor="middle">OK</text>
  <path class="dg-bracket-accent" d="M232 76 V84 H272 V76"/>
  <text class="dg-mono dg-accent-text" x="252" y="100" text-anchor="middle">WAIT 1S</text>
  <path class="dg-bracket-accent" d="M304 76 V84 H384 V76"/>
  <text class="dg-mono dg-accent-text" x="344" y="100" text-anchor="middle">WAIT 2S</text>
  <text class="dg-name" x="0" y="60">Backoff</text>
  <text class="dg-sub" x="0" y="76">each wait is longer</text>
  <!-- No jitter -->
  <line class="dg-line" x1="168" y1="144" x2="440" y2="144"/>
  <line class="dg-cross" x1="196" y1="140" x2="204" y2="148"/>
  <line class="dg-cross" x1="196" y1="148" x2="204" y2="140"/>
  <circle class="dg-dot" cx="280" cy="144" r="4"/>
  <circle class="dg-dot" cx="360" cy="144" r="4"/>
  <line class="dg-line" x1="168" y1="160" x2="440" y2="160"/>
  <line class="dg-cross" x1="196" y1="156" x2="204" y2="164"/>
  <line class="dg-cross" x1="196" y1="164" x2="204" y2="156"/>
  <circle class="dg-dot" cx="280" cy="160" r="4"/>
  <circle class="dg-dot" cx="360" cy="160" r="4"/>
  <line class="dg-line" x1="168" y1="176" x2="440" y2="176"/>
  <line class="dg-cross" x1="196" y1="172" x2="204" y2="180"/>
  <line class="dg-cross" x1="196" y1="180" x2="204" y2="172"/>
  <circle class="dg-dot" cx="280" cy="176" r="4"/>
  <circle class="dg-dot" cx="360" cy="176" r="4"/>
  <text class="dg-name" x="0" y="156">No jitter</text>
  <text class="dg-sub" x="0" y="172">clients retry at once</text>
  <!-- Jitter -->
  <line class="dg-line" x1="168" y1="224" x2="440" y2="224"/>
  <line class="dg-cross" x1="196" y1="220" x2="204" y2="228"/>
  <line class="dg-cross" x1="196" y1="228" x2="204" y2="220"/>
  <circle class="dg-dot" cx="272" cy="224" r="4"/>
  <circle class="dg-dot" cx="352" cy="224" r="4"/>
  <line class="dg-line" x1="168" y1="240" x2="440" y2="240"/>
  <line class="dg-cross" x1="196" y1="236" x2="204" y2="244"/>
  <line class="dg-cross" x1="196" y1="244" x2="204" y2="236"/>
  <circle class="dg-dot" cx="296" cy="240" r="4"/>
  <circle class="dg-dot" cx="384" cy="240" r="4"/>
  <line class="dg-line" x1="168" y1="256" x2="440" y2="256"/>
  <line class="dg-cross" x1="196" y1="252" x2="204" y2="260"/>
  <line class="dg-cross" x1="196" y1="260" x2="204" y2="252"/>
  <circle class="dg-dot" cx="316" cy="256" r="4"/>
  <circle class="dg-dot" cx="404" cy="256" r="4"/>
  <text class="dg-name" x="0" y="236">Jitter</text>
  <text class="dg-sub" x="0" y="252">retries spread out</text>
  <!-- Legend -->
  <line class="dg-rule" x1="0" y1="284" x2="448" y2="284"/>
  <line class="dg-cross" x1="200" y1="298" x2="208" y2="306"/>
  <line class="dg-cross" x1="200" y1="306" x2="208" y2="298"/>
  <text class="dg-legend" x="216" y="306">failed call</text>
  <circle class="dg-dot" cx="320" cy="302" r="4"/>
  <text class="dg-legend dg-accent-text" x="332" y="306">retry</text>
</svg>
