<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>System Design Tools</title>
    <script type="module" src="./src/app.js"></script>
  </head>
  <body>
    <main>
      <h1>System Design Tools</h1>
      <section aria-labelledby="dau-calculator-title">
        <h2 id="dau-calculator-title">MAU to DAU calculator</h2>
        <p>Change any value. The other values update to keep the relationship consistent.</p>

        <form id="calculator" novalidate>
          <p>
            <label for="mau">Monthly active users (MAU)</label>
            <input id="mau" name="mau" type="number" min="0" step="any" value="1000" inputmode="decimal" required>
          </p>
          <p>
            <label for="dau">Daily active users (DAU)</label>
            <input id="dau" name="dau" type="number" min="0" step="any" value="500" inputmode="decimal" required>
          </p>
          <p>
            <label for="percentage">Active users (%)</label>
            <input id="percentage" name="percentage" type="number" min="0" max="100" step="any" value="50" inputmode="decimal" required>
          </p>
          <p id="validation-message" role="alert" aria-live="polite"></p>
        </form>
      </section>
    </main>
  </body>
</html>
