<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>System Design Tools</title>
    <link rel="icon" href="./assets/tech0ver.png" type="image/png">
    <script type="module" src="./src/app.js"></script>
  </head>
  <body>
    <main>
      <h1>System Design Tools</h1>
      <section aria-labelledby="dau-calculator-title">
        <h2 id="dau-calculator-title">MAU to DAU calculator</h2>
        <p>Change any value. The other values update to keep the relationship consistent.</p>

        <form id="calculator" novalidate>
          <p>
            <label for="mau">Monthly active users (MAU)<br>
              <input id="mau" name="mau" type="number" min="0" step="any" value="10000000" inputmode="decimal" required>
            </label>
          </p>
          <p>
            <label for="dau">Daily active users (DAU)<br>
              <input id="dau" name="dau" type="number" min="0" step="any" value="5000000" inputmode="decimal" required>
            </label>
          </p>
          <p>
            <label for="percentage">Active users (%)<br>
              <input id="percentage" name="percentage" type="number" min="0" max="100" step="any" value="50" inputmode="decimal" required>
            </label>
          </p>
          <p id="validation-message" role="alert" aria-live="polite"></p>
        </form>
      </section>

      <section aria-labelledby="qps-calculator-title">
        <h2 id="qps-calculator-title">Read and write QPS calculator</h2>
        <p>Each operation can be performed by a different percentage of daily active users.</p>

        <fieldset data-operation="read">
          <legend>Read operations</legend>
          <p>
            <label for="read-operations-per-dau">Queries per participating user per day<br>
              <input id="read-operations-per-dau" data-property="operationsPerDau" type="number" min="0" step="any" value="1" inputmode="decimal" required>
            </label>
          </p>
          <p>
            <label for="read-dau-percentage">DAU performing reads (%)<br>
              <input id="read-dau-percentage" data-property="dauPercentage" type="number" min="0" max="100" step="any" value="100" inputmode="decimal" required>
            </label>
          </p>
          <p>
            <label for="read-qpd">Read QPD<br>
              <input id="read-qpd" data-property="qpd" type="number" min="0" step="any" inputmode="decimal" required>
            </label>
          </p>
          <p>
            <label for="read-qps">Read QPS<br>
              <input id="read-qps" data-property="qps" type="number" min="0" step="any" inputmode="decimal" required>
            </label>
          </p>
          <p>
            <label for="read-peak-multiplier">Peak multiplier<br>
              <input id="read-peak-multiplier" data-property="peakMultiplier" type="number" min="0" step="any" value="2" inputmode="decimal" required>
            </label>
          </p>
          <p>
            <label for="read-peak-qps">Read peak QPS<br>
              <input id="read-peak-qps" data-property="peakQps" type="number" min="0" step="any" inputmode="decimal" required>
            </label>
          </p>
          <p>
            <label for="read-data-bytes">Response data per read (bytes)<br>
              <input id="read-data-bytes" data-bandwidth-property="dataBytes" type="number" min="0" step="any" value="1024" inputmode="decimal" required>
            </label>
          </p>
          <p>
            <label for="read-bytes-per-day">Download bytes per day<br>
              <input id="read-bytes-per-day" data-bandwidth-property="bytesPerDay" type="number" min="0" step="any" inputmode="decimal" required>
            </label>
          </p>
          <p>
            <label for="read-bytes-per-second">Download bytes per second<br>
              <input id="read-bytes-per-second" data-bandwidth-property="bytesPerSecond" type="number" min="0" step="any" inputmode="decimal" required>
            </label>
          </p>
        </fieldset>

        <fieldset data-operation="write">
          <legend>Write operations</legend>
          <p>
            <label for="write-operations-per-dau">Queries per participating user per day<br>
              <input id="write-operations-per-dau" data-property="operationsPerDau" type="number" min="0" step="any" value="1" inputmode="decimal" required>
            </label>
          </p>
          <p>
            <label for="write-dau-percentage">DAU performing writes (%)<br>
              <input id="write-dau-percentage" data-property="dauPercentage" type="number" min="0" max="100" step="any" value="100" inputmode="decimal" required>
            </label>
          </p>
          <p>
            <label for="write-qpd">Write QPD<br>
              <input id="write-qpd" data-property="qpd" type="number" min="0" step="any" inputmode="decimal" required>
            </label>
          </p>
          <p>
            <label for="write-qps">Write QPS<br>
              <input id="write-qps" data-property="qps" type="number" min="0" step="any" inputmode="decimal" required>
            </label>
          </p>
          <p>
            <label for="write-peak-multiplier">Peak multiplier<br>
              <input id="write-peak-multiplier" data-property="peakMultiplier" type="number" min="0" step="any" value="2" inputmode="decimal" required>
            </label>
          </p>
          <p>
            <label for="write-peak-qps">Write peak QPS<br>
              <input id="write-peak-qps" data-property="peakQps" type="number" min="0" step="any" inputmode="decimal" required>
            </label>
          </p>
          <p>
            <label for="write-data-bytes">Request data per write (bytes)<br>
              <input id="write-data-bytes" data-bandwidth-property="dataBytes" type="number" min="0" step="any" value="1024" inputmode="decimal" required>
            </label>
          </p>
          <p>
            <label for="write-bytes-per-day">Upload bytes per day<br>
              <input id="write-bytes-per-day" data-bandwidth-property="bytesPerDay" type="number" min="0" step="any" inputmode="decimal" required>
            </label>
          </p>
          <p>
            <label for="write-bytes-per-second">Upload bytes per second<br>
              <input id="write-bytes-per-second" data-bandwidth-property="bytesPerSecond" type="number" min="0" step="any" inputmode="decimal" required>
            </label>
          </p>
        </fieldset>
      </section>
    </main>
  </body>
</html>
